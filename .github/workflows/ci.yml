name: Foster Famous CI

on:
  pull_request:
  push:
    branches:
      - main
      - stabilize-generation-flow

jobs:
  backend:
    name: Backend tests and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Run tests
        run: bun test
      - name: Typecheck
        run: bun run typecheck

  mobile:
    name: Mobile tests, typecheck, and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run regression tests
        run: bun test tests
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
